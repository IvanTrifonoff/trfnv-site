<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — trfnv</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .not-found { min-height: 70vh; display: grid; place-items: center; text-align: center; }
    .not-found h1 { font-size: clamp(80px, 18vw, 180px); margin: 0; }
    .not-found p { color: var(--muted); margin-bottom: 30px; }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="not-found">
    <div>
      <h1 class="accent">404</h1>
      <p>Такой страницы нет. Возможно, она ещё в разработке.</p>
      <a class="btn btn-primary" href="/">На главную →</a>
    </div>
  </main>
</body>
</html>
